<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Recetas</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body {
        background: #f4f6f8;
        color: #333;
        padding: 16px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #2c3e50;
        font-size: 1.5rem;
      }
      .card {
        background: #fff;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      h2 {
        margin-bottom: 15px;
        color: #34495e;
        font-size: 1.2rem;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      input,
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccd;
        border-radius: 6px;
        font-size: 1rem; /* 16px evita zoom automático en iOS */
        min-height: 44px; /* objetivo táctil recomendado */
        background: #fff;
      }
      input:focus,
      select:focus {
        outline: 2px solid #3498db;
        outline-offset: 1px;
        border-color: #3498db;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .row > div {
        flex: 1;
        min-width: 140px;
      }
      button {
        background: #3498db;
        color: #fff;
        border: none;
        padding: 12px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        min-height: 44px;
      }
      button:hover {
        background: #2980b9;
      }
      button:active {
        transform: scale(0.98);
      }
      button.danger {
        background: #e74c3c;
        padding: 10px 14px;
        min-height: 44px;
        min-width: 44px;
      }
      button.danger:hover {
        background: #c0392b;
      }
      button.secondary {
        background: #95a5a6;
      }
      button.secondary:hover {
        background: #7f8c8d;
      }

      /* Fila de ingrediente: grilla con nombre arriba, resto abajo */
      .ing-row {
        display: grid;
        grid-template-columns: 2fr 1fr 0.8fr 1fr auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 10px;
      }
      .ing-row .del-wrap {
        display: flex;
        align-items: flex-end;
      }

      .table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        min-width: 420px;
      }
      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid #eee;
        text-align: left;
        font-size: 0.9rem;
        white-space: nowrap;
      }
      th {
        background: #f0f3f6;
      }
      .result-box {
        background: #eafaf1;
        border: 1px solid #a9dfbf;
        border-radius: 8px;
        padding: 15px;
        margin-top: 15px;
      }
      .result-box p {
        margin: 8px 0;
      }
      .big {
        font-size: 1.3rem;
        font-weight: bold;
        color: #27ae60;
      }
      #ingredientList {
        margin-left: 20px;
        line-height: 1.7;
      }
      .btn-full {
        width: 100%;
      }

      /* ---------- MOBILE ---------- */
      @media (max-width: 640px) {
        body {
          padding: 10px;
        }
        .card {
          padding: 14px;
        }
        .row > div {
          min-width: 100%; /* campos apilados */
        }
        button {
          width: 100%; /* botones a todo lo ancho */
        }
        /* Cada ingrediente como tarjeta: nombre arriba, qty/unidad/precio en fila, botón al final */
        .ing-row {
          grid-template-columns: 1fr 1fr 1fr auto;
          grid-template-areas:
            "name name name name"
            "qty unit price del";
          border: 1px solid #e3e8ee;
          border-radius: 8px;
          padding: 10px;
          background: #fafbfc;
        }
        .ing-row .c-name {
          grid-area: name;
        }
        .ing-row .c-qty {
          grid-area: qty;
        }
        .ing-row .c-unit {
          grid-area: unit;
        }
        .ing-row .c-price {
          grid-area: price;
        }
        .ing-row .del-wrap {
          grid-area: del;
          align-items: flex-end;
        }
        .ing-row button.danger {
          width: auto;
        }
        #ingredientRows .ing-row > div {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🧮 Calculadora de Recetas</h1>

      <div class="card">
        <h2>1. Receta base</h2>
        <div class="row">
          <div>
            <label for="recipeName">Nombre de la receta</label>
            <input id="recipeName" placeholder="Ej: Pan casero" />
          </div>
          <div>
            <label for="baseYield">Rinde (unidades)</label>
            <input
              id="baseYield"
              type="number"
              inputmode="decimal"
              step="any"
              value="10"
              min="1"
            />
          </div>
        </div>

        <h2 style="margin-top: 15px">Ingredientes</h2>
        <div id="ingredientRows"></div>
        <button class="secondary btn-full" onclick="addIngredientRow()">
          + Agregar ingrediente
        </button>
      </div>

      <div class="card">
        <h2>2. Escalar receta</h2>
        <div class="row">
          <div>
            <label for="targetYield">Unidades deseadas</label>
            <input
              id="targetYield"
              type="number"
              inputmode="decimal"
              step="any"
              value="100"
              min="1"
            />
          </div>
          <div style="display: flex; align-items: flex-end">
            <button class="btn-full" onclick="calculate()">Calcular</button>
          </div>
        </div>
      </div>

      <div class="card" id="resultsCard" style="display: none">
        <h2>
          3. Resultado: <span id="scaledName"></span> (<span
            id="scaledYield"
          ></span>
          unds)
        </h2>
        <h3 style="margin: 10px 0 5px">📦 Ingredientes a usar:</h3>
        <ul id="ingredientList"></ul>
        <div class="table-wrap">
          <table id="resultsTable">
            <thead>
              <tr>
                <th>Ingrediente</th>
                <th>Cantidad</th>
                <th>Unidad</th>
                <th>Costo</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="result-box">
          <p>Costo total de ingredientes: <strong id="totalCost"></strong></p>
          <p>Costo por unidad: <strong id="costPerUnit"></strong></p>
          <div style="margin-top: 10px; max-width: 220px">
            <label for="marginPercent">Margen de ganancia (%)</label>
            <input
              id="marginPercent"
              type="number"
              inputmode="decimal"
              step="any"
              value="30"
              min="0"
              oninput="priceFromMargin()"
            />
          </div>
          <p>
            Precio venta sugerido total:
            <span class="big" id="suggestedTotal"></span>
          </p>
          <p>
            Precio venta sugerido por unidad:
            <span class="big" id="suggestedUnit"></span>
          </p>
        </div>
      </div>
    </div>

    <script>
      let last = null;

      // Precio en pesos colombianos, sin decimales, formato $ 1.234.567
      function formatMoney(n) {
        return (
          "$ " +
          Math.round(n).toLocaleString("es-CO", { maximumFractionDigits: 0 })
        );
      }

      // Cantidad con unidad: si está en gr y llega a 1000, mostrar en kg
      function formatQty(qty, unit) {
        let q = qty;
        let u = unit;
        if (u === "g") u = "gr";
        if (u === "gr" && qty >= 1000) {
          q = qty / 1000;
          u = "kg";
        }
        let txt;
        if (u === "gr") {
          txt = Math.round(q).toLocaleString("es-CO");
        } else {
          txt = Number(q.toFixed(2)).toLocaleString("es-CO", {
            maximumFractionDigits: 2,
          });
        }
        return { qty: txt, unit: u };
      }

      function addIngredientRow(name = "", qty = "", unit = "kg", price = "") {
        const div = document.createElement("div");
        div.className = "ing-row";
        div.innerHTML = `
          <div class="c-name"><label>Ingrediente</label><input class="ing-name" value="${name}" placeholder="Harina"></div>
          <div class="c-qty"><label>Cantidad</label><input class="ing-qty" type="number" inputmode="decimal" step="any" value="${qty}" placeholder="1"></div>
          <div class="c-unit"><label>Unidad</label>
            <select class="ing-unit">
              <option value="kg" ${unit === "kg" ? "selected" : ""}>kg</option>
              <option value="lb" ${unit === "lb" ? "selected" : ""}>lb</option>
              <option value="gr" ${unit === "gr" || unit === "g" ? "selected" : ""}>gr</option>
              <option value="und" ${unit === "und" ? "selected" : ""}>und</option>
              <option value="lt" ${unit === "lt" ? "selected" : ""}>lt</option>
            </select>
          </div>
          <div class="c-price"><label>Precio</label><input class="ing-price" type="number" inputmode="decimal" step="any" value="${price}" placeholder="2500"></div>
          <div class="del-wrap"><button class="danger" aria-label="Eliminar ingrediente" onclick="this.closest('.ing-row').remove()">✕</button></div>`;
        document.getElementById("ingredientRows").appendChild(div);
      }

      // factor para convertir la unidad del ingrediente a la unidad de precio (kg o lb)
      function priceFactor(unit) {
        switch (unit) {
          case "kg":
            return 1; // precio ya es por kg
          case "gr":
          case "g":
            return 0.001; // gr -> kg
          case "lb":
            return 1; // precio ya es por lb
          default:
            return 1; // und, lt: el precio se interpreta por unidad
        }
      }

      function calculate() {
        const baseYield = parseFloat(
          document.getElementById("baseYield").value,
        );
        const targetYield = parseFloat(
          document.getElementById("targetYield").value,
        );
        if (!baseYield || !targetYield || baseYield <= 0 || targetYield <= 0) {
          alert("Ingresa rendimientos válidos (mayores a 0)");
          return;
        }

        const factor = targetYield / baseYield;
        let total = 0;
        const tbody = document.querySelector("#resultsTable tbody");
        const list = document.getElementById("ingredientList");
        tbody.innerHTML = "";
        list.innerHTML = "";
        document.getElementById("scaledName").textContent =
          document.getElementById("recipeName").value || "Receta";
        document.getElementById("scaledYield").textContent = targetYield;

        document.querySelectorAll("#ingredientRows .ing-row").forEach((row) => {
          const name = row.querySelector(".ing-name").value || "Ingrediente";
          const qty = parseFloat(row.querySelector(".ing-qty").value);
          const unit = row.querySelector(".ing-unit").value;
          const price = parseFloat(row.querySelector(".ing-price").value);
          if (isNaN(qty) || isNaN(price)) return;

          const scaledQty = qty * factor;
          // kg y lb no se mezclan: asumimos precio en la misma unidad ingresada (kg->kg, lb->lb)
          const cost = scaledQty * priceFactor(unit) * price;
          total += cost;

          const disp = formatQty(scaledQty, unit);
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${name}</td><td>${disp.qty}</td><td>${disp.unit}</td><td>${formatMoney(cost)}</td>`;
          tbody.appendChild(tr);

          const li = document.createElement("li");
          li.innerHTML = `<strong>${disp.qty} ${disp.unit}</strong> de ${name}`;
          list.appendChild(li);
        });

        last = { total, targetYield };
        document.getElementById("totalCost").textContent =
          formatMoney(total);
        document.getElementById("costPerUnit").textContent = formatMoney(
          total / targetYield,
        );
        document.getElementById("resultsCard").style.display = "block";
        priceFromMargin();
        // desplaza suavemente al resultado para que el usuario lo vea
        document
          .getElementById("resultsCard")
          .scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function priceFromMargin() {
        if (!last) return;
        const margin =
          parseFloat(document.getElementById("marginPercent").value) || 0;
        const suggestedTotal = last.total * (1 + margin / 100);
        document.getElementById("suggestedTotal").textContent =
          formatMoney(suggestedTotal);
        document.getElementById("suggestedUnit").textContent = formatMoney(
          suggestedTotal / last.targetYield,
        );
      }

      addIngredientRow();
    </script>
  </body>
</html>
